name: Website quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve verified client logos in repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node scripts/import-client-logos.mjs
          git add assets/clients/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Preserve client logos from the existing Glonass Navi website"
            git push origin HEAD:main
          fi
      - name: Load client logos for non-publishing checks
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: node scripts/import-client-logos.mjs
      - name: Check calculations, messages and site links
        run: |
          npm test
          npm run test:site
      - name: Install browser test tooling
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile journeys
        run: npm run test:browser
      - name: Save browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
